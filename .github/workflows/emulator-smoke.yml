# Boot a real Android emulator, install the keyboard, and prove it works.
#
# This is the "test it before I test it on my phone" gate. It produces screenshots and framework
# dumps as evidence, so a green run means somebody has actually SEEN the keyboard render and
# commit text -- not merely that it compiled.
#
# Why this works on GitHub-hosted runners: ubuntu-latest x86_64 runners expose /dev/kvm, but its
# default permissions (crw-rw---- root:kvm) exclude the runner user. Without the udev rule below
# the emulator silently falls back to `-accel off` software emulation and effectively hangs, so
# the KVM step is mandatory, not an optimisation.
#
# Cost note: no AVD snapshot cache yet -- a cold boot costs several minutes per run. Worth adding
# caching once this workflow is stable. The build runs BEFORE the emulator launches so Gradle and
# the emulator do not compete for the runner's 4 vCPUs.

name: Emulator smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - arena/23fde500-keyboard
      - main

permissions:
  contents: read

concurrency:
  group: emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # x86_64 split specifically: the emulator is x86_64 and cannot load the ARM splits.
      - name: Build debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Confirm an x86_64 APK exists
        run: |
          find build/outputs/apk/debug -name '*.apk' -printf '%p  %s bytes\n'
          test -n "$(find build/outputs/apk/debug -name '*x86_64*.apk' | head -1)"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # API 34 matches compileSdk. google_apis (not playstore) so the image is rootable and
      # `run-as` works on our debuggable build.
      # disable-spellchecker avoids the framework spell-checker popup, a known source of
      # flakiness when asserting on text fields.
      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 900
          script: bash scripts/ci/emulator-smoke.sh

      - name: Upload evidence (screenshots, dumps, logcat)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-run-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
