# Build installable debug APKs.
#
# This is the project's build system. The dev sandbox has no JDK, no Android SDK and no route to
# Maven Central / dl.google.com, so APKs are produced here and installed from the Actions artifact
# or the rolling `dev-builds` release.
#
# Deliberate choices, and why:
#   * `assembleDebug` only -- NOT `test`. Upstream's drift tests assert on repository files this
#     fork does not vendor (`docs/RELEASE_RECORD.md`, `.github/scripts/emulator-ci.sh`,
#     `fastlane/`), so they would fail for reasons unrelated to code correctness.
#     See docs/PROVENANCE.md.
#   * No ImageMagick / icon-generation step. `res/mipmap-*` launcher icons are committed, and
#     upstream's `scripts/generate_icons.sh` is a CI convenience, not a Gradle task.
#   * No keystore secret. `debug.keystore` is committed (force-added past the `*.keystore`
#     gitignore rule), so every build shares one signature and installs as an UPGRADE over the
#     previous one instead of requiring an uninstall.
#   * Python 3 is already on ubuntu-latest. `build.gradle` execs six stdlib-only generators at
#     build time; no pip step is needed.

name: Build APK

on:
  push:
    branches:
      # Every Arena session works on its own branch; the old single-branch list meant a new
      # session's pushes built nothing at all, so its first green build was a surprise merge.
      - 'arena/**'
      - main
    # A docs-only change cannot alter an APK, and each push costs a ~6 min build plus a ~9 min
    # emulator run. workflow_dispatch still always runs, so nothing becomes unbuildable silently.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      # The offline harness runs section 7d against a fake adb on a laptop; CI never invokes it, so
      # a change there cannot alter an APK or a smoke verdict.
      - 'scripts/ci/offline/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 45 was not enough once the whole unit-test suite ran on every build: it needs ~20 min on a
    # good runner and the emulator-free job still has to assemble the APK around it. 90 gives the
    # suite room to finish (and to report) instead of being cancelled by the ceiling.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Single-module project rooted at the repo: APKs land in build/outputs/apk/debug/.
      # ABI splits are enabled in build.gradle (armeabi-v7a, arm64-v8a, x86_64; no universal).
      - name: Build debug APKs
        shell: bash
        run: |
          # tee keeps the full log for the annotation step below. pipefail matters: bash's default
          # here is `bash -e` WITHOUT pipefail, so a piped tee would mask a failed Gradle exit and
          # every build would look green.
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-output.log

      # A failed `assembleDebug` otherwise reports only "Process completed with exit code 1": the
      # log lives on results-receiver.actions.githubusercontent.com and the report artifacts on
      # blob storage, neither reachable outside the web UI. Annotations ARE reachable via
      # api.github.com, so the compiler diagnostics go there. GitHub keeps roughly 20 annotations
      # per run and errors survive where notices do not, so emit at most a few and prefer the
      # actual diagnostic lines over Gradle's summary block.
      - name: Surface build errors as annotations
        if: failure()
        shell: bash
        run: |
          [ -f build-output.log ] || exit 0
          # `%` must be escaped or GitHub misparses the annotation; lines arrive one per read.
          esc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g'; }
          # Kotlin `e: file:///…:L:C msg`, javac/aapt `path: error: msg`, failing task, Gradle header.
          grep -E "^e: |: error: |: aapt2? error|^> Task .* FAILED|^FAILURE: " build-output.log \
            | head -8 | esc | while IFS= read -r line; do echo "::error::${line}"; done
          # No compiler diagnostic at all (a config/resource/script failure): give the Gradle
          # "What went wrong" block instead, which names the failing task and its cause.
          if ! grep -qE "^e: |: error: |: aapt2? error" build-output.log; then
            sed -n '/What went wrong/,/^\* Try/p' build-output.log | head -12 | esc \
              | while IFS= read -r line; do echo "::error::${line}"; done
          fi

      # Advisory, never gating: `continue-on-error` keeps a red unit test from blocking the APK,
      # but the per-class summary and every failing assertion still surface as annotations below.
      #
      # Per-push signal: a hand-picked subset that is pure JVM and cheap (~3 min).
      #
      # The WHOLE suite runs nightly and on demand in `.github/workflows/full-test-suite.yml`.
      # Measured 2026-10-31: the whole suite takes ~20 min on a good run and, with the test JVM
      # given 3 GB so a dozen `OutOfMemoryError` classes could finish, it blew past 70 minutes
      # without completing — the heavier geometric-engine sweeps trade a fast OOM for minutes of
      # GC. That is a budget question, not a correctness one, so it lives in its own job with its
      # own timeout instead of blocking every push.
      #
      # The subset is a FILTER, and a filter silently skips whatever it does not name: that is how
      # `SettingsRangeDriftTest` — cited by two earlier reports as proof that the settings ranges
      # cannot drift — sat unexecuted until 2026-10-31, when it immediately found a real
      # divergence (sound_volume's 0..100 bound restated in three places). The nightly run is what
      # makes the filter safe: nothing can hide there forever.
      #
      # Gradle compiles EVERY test source before running, so this also serves as the compile check
      # for the whole test source set on every push.
      - name: Unit tests (fast subset, advisory)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest \
            --tests 'tribixbite.cleverkeys.a11y.*' \
            --tests 'tribixbite.cleverkeys.popover.*' \
            --tests 'tribixbite.cleverkeys.gesture.*' \
            --tests 'tribixbite.cleverkeys.prefs.*' \
            --tests 'tribixbite.cleverkeys.clipboard.*' \
            --tests '*FloatingConfigTest' \
            --tests '*Autocapitalisation*' \
            --tests '*SettingsRangeDriftTest' \
            --tests '*ConfigurationBurstCoalescingTest' \
            --tests '*VerboseLogRatchetTest' \
            2>&1 | tee unit-test-output.log

      # Reachable summary: per-class counts from the JUnit XML, plus any compiler diagnostic.
      - name: Summarise unit-test results as annotations
        shell: bash
        run: |
          esc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g'; }
          # `|| true`: no compiler diagnostics is the GOOD case, and bash -e would otherwise
          # fail this step on grep's exit 1 and skip the summary below it.
          if [ -f unit-test-output.log ]; then
            grep -E "^e: |: error: |^> Task .* FAILED" unit-test-output.log | head -3 | esc \
              | while IFS= read -r line; do echo "::error::${line}"; done || true
          fi
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET

          def esc(t):
              return t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          rows, cases = [], []
          for f in sorted(glob.glob('build/test-results/testDebugUnitTest/*.xml')):
              try:
                  r = ET.parse(f).getroot()
              except Exception:
                  continue
              name = r.get('name', '?')
              tests, skipped = int(r.get('tests', 0)), int(r.get('skipped', 0))
              failed = int(r.get('failures', 0)) + int(r.get('errors', 0))
              rows.append((name, tests, failed, skipped))
              for case in r.iter('testcase'):
                  for kind in ('failure', 'error'):
                      node = case.find(kind)
                      if node is None:
                          continue
                      msg = ' '.join((node.get('message') or node.text or '').split())
                      cases.append((name, case.get('name', '?'), msg))
                      break

          if not rows:
              print('::warning::no JUnit XML found - the test task did not run')
              raise SystemExit(0)

          total = sum(r[1] for r in rows)
          bad = sum(r[2] for r in rows)
          skipped = sum(r[3] for r in rows)
          bad_classes = sorted([r for r in rows if r[2]], key=lambda r: (-r[2], r[0]))
          print('::notice::unit tests: %d run, %d failed, %d skipped in %d classes'
                % (total, bad, skipped, len(rows)))
          skipped_classes = [r for r in rows if r[3] and not r[2]]
          if skipped_classes:
              print('::notice::%d class(es) skipped their checks (upstream artefacts absent): %s'
                    % (len(skipped_classes),
                       ', '.join(r[0].split('.')[-1] for r in skipped_classes)[:1000]))

          # Everything a person needs, in as few annotations as the limit allows: the ceiling is
          # TEN per step, so the two below carry the whole inventory (class + counts, then the
          # first failure of each class). The step summary gets the unabridged list.
          slow = sorted(((float(r.get('time', 0) or 0), r.get('name', '?')) for r in
                         (ET.parse(f).getroot() for f in glob.glob('build/test-results/testDebugUnitTest/*.xml'))), reverse=True)
          if slow:
              print('::notice::slowest classes: %s'
                    % ', '.join('%s %.1fs' % (n.split('.')[-1], t) for t, n in slow[:10])[:1000])

          if bad_classes:
              short = '; '.join('%s %d/%d' % (n.split('.')[-1], f, t) for n, t, f, _ in bad_classes)
              print('::error::' + esc('FAILING CLASSES (%d): %s' % (len(bad_classes), short))[:60000])

              parts, size = [], 0
              for name, tests, failed, _ in bad_classes:
                  first = next((c for c in cases if c[0] == name), None)
                  if first is None:
                      continue
                  seg = '%s#%s: %s' % (name.split('.')[-1], first[1], first[2][:180])
                  if size + len(seg) > 55000:
                      break
                  parts.append(seg)
                  size += len(seg) + 3
              print('::error::' + esc('FIRST FAILURE PER CLASS: ' + ' | '.join(parts))[:60000])

              # Which cases: names only, so a class with 25 failures does not cost 25 messages.
              names = {}
              for name, case, _ in cases:
                  names.setdefault(name, []).append(case)
              detail = '; '.join('%s: %s' % (n.split('.')[-1], ', '.join(v[:40]))
                                 for n, v in sorted(names.items()))
              print('::error::' + esc('FAILING TESTS: ' + detail)[:60000])

              summary = ['### Unit tests', '',
                         '- %d run, **%d failed**, %d skipped, %d classes' % (total, bad, skipped, len(rows)),
                         '', '#### Failing classes', '']
              summary += ['- `%s` — %d of %d' % (n, f, t) for n, t, f, _ in bad_classes]
              summary += ['', '#### Failures (first 60)', '']
              for name, case, msg in cases[:60]:
                  summary.append('- `%s#%s`: %s' % (name.split('.')[-1], case, msg[:300]))
              path = os.environ.get('GITHUB_STEP_SUMMARY')
              if path:
                  with open(path, 'a') as fh:
                      fh.write('\n'.join(summary) + '\n')
          else:
              print('::notice::all %d unit tests passed' % total)
          PY

      - name: Report APK sizes
        run: |
          cd build/outputs/apk/debug
          ls -la
          for f in *.apk; do
            printf '%-52s %6s MB\n' "$f" "$(du -m "$f" | cut -f1)"
          done

      - name: Compute short SHA
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Stable per-ABI filenames: the rolling release below overwrites the same asset names every
      # run, giving one permanent download URL per ABI. The build number lives in the artifact name
      # and the release body instead.
      - name: Rename APKs
        run: |
          cd build/outputs/apk/debug
          for apk in *.apk; do
            case "$apk" in
              *arm64-v8a*)   new="keyboard-arm64-v8a.apk"   ;;
              *armeabi-v7a*) new="keyboard-armeabi-v7a.apk" ;;
              *x86_64*)      new="keyboard-x86_64.apk"      ;;
              *)             new="keyboard-$apk"             ;;
            esac
            [ "$apk" = "$new" ] || mv "$apk" "$new"
          done
          ls -la

      # Rolling prerelease. `arm64-v8a` is the one to install on any phone from 2017 onward.
      - name: Publish rolling dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-builds
          name: Dev builds (rolling)
          prerelease: true
          files: build/outputs/apk/debug/*.apk
          body: |
            Latest debug APKs. This release is overwritten on every successful build, so these
            links are permanent.

            | Field | Value |
            |---|---|
            | Branch | `${{ github.ref_name }}` |
            | Commit | `${{ steps.meta.outputs.sha }}` |
            | Built | ${{ github.event.head_commit.timestamp || 'manual dispatch' }} |

            **Which file?** `keyboard-arm64-v8a.apk` for essentially any phone from 2017 onward.
            `keyboard-armeabi-v7a.apk` for older 32-bit devices. `keyboard-x86_64.apk` for
            emulators and Chromebooks.

            Installs as an **upgrade** over the previous build — the debug keystore is stable, so
            no uninstall is needed.

            After installing: Settings → System → Languages & input → On-screen keyboard → enable it.

      # NOT uploaded on every push. Each artifact was all three ABIs (~94 MB), and 41 of them
      # filled 3.9 GB of a 500 MB private-repo quota -- which is what made this workflow fail at
      # the upload step on 2026-10-23 and skip the release entirely. The APKs are already on the
      # rolling release at permanent URLs, so an artifact per push is pure duplication; it exists
      # only for the case of inspecting a build without downloading from the release, which is a
      # manual-dispatch situation, not a push. Retention is 3 days: the release is the durable copy.
      - name: Upload build artifact (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: keyboard-debug-${{ steps.meta.outputs.sha }}
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          # 1 day, not 3: each of these is ~94 MB, and the rolling `dev-builds` release below
          # already publishes the same APKs under permanent URLs (release assets do not count
          # against the Actions artifact quota, artifacts do). One day is enough for the manual
          # dispatch that asked for an artifact; a pile of them is what exhausted the 500 MB
          # private-repo quota in October 2026.
          retention-days: 1

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ steps.meta.outputs.sha }}
          path: |
            build/reports
            build/outputs/logs
            build-output.log
          if-no-files-found: ignore
          # Small (logs), but the 500 MB private-repo quota is shared with the smoke evidence.
          retention-days: 5
