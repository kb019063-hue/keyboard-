# Whole unit-test suite — nightly, and on any change to this file.
#
# Why not in `build-apk.yml`: measured 2026-10-31, the whole suite needs ~20 minutes on a good
# run, and once the test JVM was given 3 GB (so a dozen `OutOfMemoryError` classes could finish)
# it ran past 70 minutes without completing. That is a budget problem, not a correctness one, so
# it gets its own job and its own timeout instead of taxing every push.
#
# Why it exists at all: `build-apk.yml` runs a FILTER (`--tests` patterns), and a filter silently
# skips whatever it does not name. `SettingsRangeDriftTest` — which two earlier reports cited as
# the proof that the settings ranges cannot drift — had therefore never executed, and the first
# time it did (2026-10-31) it immediately found a real divergence: `sound_volume`'s 0..100 bound
# restated in three places, one of which the keyboard ignored. This job is what stops that
# happening again: everything runs at least once a day, and a failure means something in THIS
# repository is wrong.
#
# Classes that assert on upstream artefacts this fork does not vendor (`docs/RELEASE_RECORD.md`,
# `fastlane/`, `docs/i18n/glossary.json`, `.github/scripts/emulator-ci.sh`,
# `scripts/dictionaries/*.zip`) report SKIPPED via `UpstreamArtefacts`, not passed and not failed.
#
# Triggered without a terminal: editing and committing this file to `main` runs it (that is how
# the first run after a change happens); otherwise the nightly schedule does. `workflow_dispatch`
# is there for anyone with a working CLI.

name: Full unit-test suite

on:
  schedule:
    # 03:17 UTC — off the hour, so it does not queue behind everyone else's cron.
    - cron: '17 3 * * *'
  push:
    branches:
      - main
      # A change to this file must be exercised on the branch that made it, not only after the
      # merge. Only this file is listed under `paths`, so ordinary pushes never run the suite.
      - 'arena/**'
    paths:
      - '.github/workflows/full-test-suite.yml'
      # The test task's configuration (heap, filters, timeout) lives here: a change to it can
      # change every verdict below, so it must be exercised on the branch that made it.
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-test-suite
  # A stale run is worthless once a newer commit exists, and this suite can occupy a runner for
  # tens of minutes: supersede instead of queueing behind it.
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # Measured 2026-11-01: a normal whole-suite run takes 11-12 minutes; one run sat inside the
    # test task for 90+ minutes with no progress. The Gradle test task is now bounded at 45
    # minutes (build.gradle), so 75 leaves room for checkout, setup, the report step and the
    # upload, and none of it can be spent sitting on a wedged class.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # No `--tests` filter: this job's whole point is that nothing is skipped for being
      # unlisted. `--continue` is not needed (Gradle runs every test in the task), and the task
      # is allowed to fail so the summary below still runs and reports.
      - name: Unit tests (whole suite, minus the memory-hungry engine classes)
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest -PskipHeavy=true --stacktrace 2>&1 | tee unit-test-output.log
          # Gradle deletes a re-run task's previous outputs, and the heavy invocation below is a
          # re-run of this same task: without this copy its XML vanished and the report covered
          # 7 classes instead of 423 (first attempt, run 41366549694).
          rm -rf build/full-suite-xml
          mkdir -p build/full-suite-xml
          cp -r build/test-results/testDebugUnitTest/. build/full-suite-xml/ 2>/dev/null || true

      # The engine accuracy/benchmark classes hold the whole 98k-word lexicon (some hold several)
      # and die with OutOfMemoryError on the default heap. They are not slow, they are hungry: a
      # 3 GB heap for the ENTIRE suite was measured on 2026-10-31 to turn a 12-minute run into a
      # 70-minute GC crawl, so they get their own invocation, their own heap, their own 45-minute
      # bound (build.gradle) and their own JUnit XML directory, which the report step below reads
      # alongside the main one.
      - name: Unit tests (memory-hungry engine classes, 3g heap)
        id: heavy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest -PonlyHeavy=true -PtestMaxHeap=3g \
            -PjunitXmlDir=build/test-results/heavy --stacktrace 2>&1 | tee heavy-test-output.log

      - name: Report results as annotations and a job summary
        shell: bash
        run: |
          esc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g'; }
          if [ -f unit-test-output.log ]; then
            grep -E "^e: |: error: |^> Task .* FAILED" unit-test-output.log | head -3 | esc \
              | while IFS= read -r line; do echo "::error::${line}"; done || true
            # A task that fails before producing any XML says WHY only in this block; without it
            # the report is "no JUnit XML found", which names nothing.
            sed -n '/What went wrong/,/^\* Try/p' unit-test-output.log | head -6 | esc \
              | while IFS= read -r line; do echo "::error::GRADLE ${line}"; done || true
          fi
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET

          def esc(t):
              return t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          rows, cases = [], []
          for f in sorted(glob.glob('build/full-suite-xml/*.xml') +
                          glob.glob('build/test-results/heavy/*.xml')):
              try:
                  r = ET.parse(f).getroot()
              except Exception:
                  continue
              name = r.get('name', '?')
              tests, skipped = int(r.get('tests', 0)), int(r.get('skipped', 0))
              failed = int(r.get('failures', 0)) + int(r.get('errors', 0))
              rows.append((name, tests, failed, skipped))
              for case in r.iter('testcase'):
                  for kind in ('failure', 'error'):
                      node = case.find(kind)
                      if node is None:
                          continue
                      msg = ' '.join((node.get('message') or node.text or '').split())
                      # Two project frames: the message alone cannot say WHICH line, and the
                      # runner log is not reachable outside the web UI.
                      frames = []
                      for line in (node.text or '').splitlines():
                          if 'tribixbite.cleverkeys' not in line or 'Test' in line:
                              continue
                          at = line.strip()
                          if at.startswith('at '):
                              at = at[3:]
                          head, _, tail = at.partition('(')
                          frames.append(head.split('.')[-1] + '(' + tail)
                          if len(frames) == 2:
                              break
                      cases.append((name, case.get('name', '?'), msg, frames))
                      break

          if not rows:
              print('::warning::no JUnit XML found - the test task did not run')
              raise SystemExit(0)

          total = sum(r[1] for r in rows)
          bad = sum(r[2] for r in rows)
          skipped = sum(r[3] for r in rows)
          bad_classes = sorted([r for r in rows if r[2]], key=lambda r: (-r[2], r[0]))
          print('::notice::unit tests: %d run, %d failed, %d skipped in %d classes'
                % (total, bad, skipped, len(rows)))

          skipped_classes = [r for r in rows if r[3] and not r[2]]
          if skipped_classes:
              print('::notice::%d class(es) skipped their checks (upstream artefacts absent): %s'
                    % (len(skipped_classes),
                       ', '.join(r[0].split('.')[-1] for r in skipped_classes)[:1000]))

          if bad_classes:
              # Order matters: GitHub drops annotations past its per-run cap, and the first
              # failure of each class is what makes the rest diagnosable. Emit it before the
              # class list and the per-test names.
              parts, size = [], 0
              for name, tests, failed, _ in bad_classes:
                  first = next((c for c in cases if c[0] == name), None)
                  if first is None:
                      continue
                  trace = (' <' + ' '.join(first[3]) + '>') if first[3] else ''
                  seg = '%s#%s: %s%s' % (name.split('.')[-1], first[1], first[2][:110], trace)
                  if size + len(seg) > 3000:
                      break
                  parts.append(seg)
                  size += len(seg) + 2
              print('::error::' + esc('FIRST FAILURE PER CLASS (top): ' + ' || '.join(parts))[:3000])

              short = '; '.join('%s %d/%d' % (n.split('.')[-1], f, t) for n, t, f, _ in bad_classes)
              print('::error::' + esc('FAILING CLASSES (%d): %s' % (len(bad_classes), short))[:3000])

              names = {}
              for name, case, _, _ in cases:
                  names.setdefault(name, []).append(case)
              detail = '; '.join('%s: %s' % (n.split('.')[-1], ', '.join(v[:40]))
                                 for n, v in sorted(names.items()))
              print('::error::' + esc('FAILING TESTS: ' + detail)[:60000])

              summary = ['### Unit tests', '',
                         '- %d run, **%d failed**, %d skipped, %d classes' % (total, bad, skipped, len(rows)),
                         '', '#### Failing classes', '']
              summary += ['- `%s` — %d of %d' % (n, f, t) for n, t, f, _ in bad_classes]
              summary += ['', '#### Failures (first 80)', '']
              for name, case, msg, frames in cases[:80]:
                  summary.append('- `%s#%s`: %s%s' % (name.split('.')[-1], case, msg[:300],
                                                     (' <' + ' '.join(frames) + '>') if frames else ''))
              path = os.environ.get('GITHUB_STEP_SUMMARY')
              if path:
                  with open(path, 'a') as fh:
                      fh.write('\n'.join(summary) + '\n')
          else:
              print('::notice::all %d unit tests passed' % total)
          PY

      # The annotations truncate; this keeps the full JUnit XML (every message and stack trace) for
      # a day, which is the difference between "some test failed" and a diagnosis.
      - name: Upload unit-test XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-xml
          path: |
            build/full-suite-xml/*.xml
            build/test-results/heavy/*.xml
          if-no-files-found: ignore
          retention-days: 1

      # Make the job result mean what it says: the test task is advisory above only so the report
      # always runs; the verdict is applied here.
      - name: Fail the job when tests failed
        if: steps.tests.outcome == 'failure' || steps.heavy.outcome == 'failure'
        run: |
          echo "::error::the whole suite is not green - see the annotations and the job summary"
          exit 1
