# Whole unit-test suite — nightly, and on any change to this file.
#
# Why not in `build-apk.yml`: measured 2026-10-31, the whole suite needs ~20 minutes on a good
# run, and once the test JVM was given 3 GB (so a dozen `OutOfMemoryError` classes could finish)
# it ran past 70 minutes without completing. That is a budget problem, not a correctness one, so
# it gets its own job and its own timeout instead of taxing every push.
#
# Why it exists at all: `build-apk.yml` runs a FILTER (`--tests` patterns), and a filter silently
# skips whatever it does not name. `SettingsRangeDriftTest` — which two earlier reports cited as
# the proof that the settings ranges cannot drift — had therefore never executed, and the first
# time it did (2026-10-31) it immediately found a real divergence: `sound_volume`'s 0..100 bound
# restated in three places, one of which the keyboard ignored. This job is what stops that
# happening again: everything runs at least once a day, and a failure means something in THIS
# repository is wrong.
#
# Measured 2026-11-01 (run 41369205687): 4,650 tests in 413 classes, 22 minutes wall clock on
# Gradle's default test heap with the heavy classes split into a second invocation. That is the
# number the 75-minute job timeout is sized against; a run that approaches it is a signal, not
# noise. (This paragraph used to call that heap "the default 2 GB". Nothing ever set 2 GB: the
# default is 512 MB, which is what the JVM itself reported the first time it was asked, on
# 2026-11-12. The whole-suite step below says what was found then and what the heap is now.)
#
# State at the end of the 2026-11-01 pass: 4,650 run, 0 failed, 204 skipped — the skips are the 22
# upstream-artefact classes reporting SKIPPED rather than passing. From here a red run means a real
# problem in this repository, which is the whole purpose of running everything.
#
# Classes that assert on upstream artefacts this fork does not vendor (`docs/RELEASE_RECORD.md`,
# `fastlane/`, `docs/i18n/glossary.json`, `.github/scripts/emulator-ci.sh`,
# `scripts/dictionaries/*.zip`) report SKIPPED via `UpstreamArtefacts`, not passed and not failed.
#
# The per-push job in `build-apk.yml` also runs the two resource-parsing classes
# (`CommandCatalogLocalizationTest`, `TranslationLengthTest`), so a missing translation is caught
# on the push that introduces it; since 2026-11-03 it also runs `DictationPolicyTest`, because a
# wrong verdict from the dictation table is a behaviour change the user feels immediately and the
# policy class is pure. This job is what catches everything else.
#
# When it runs: every merge to `main`, every push to an open pull request that targets `main`, the
# nightly schedule, and on demand. `workflow_dispatch` is there for anyone with a working CLI (the
# dev sandbox's token gets 403 on it, so in practice: push).

name: Full unit-test suite

on:
  schedule:
    # 03:17 UTC — off the hour, so it does not queue behind everyone else's cron. GitHub's
    # scheduler is best-effort: the 2026-11-01..03 runs actually started 05:24-07:42 after the
    # cron, which is normal and is why the nightly is the backstop, not the guarantee.
    - cron: '17 3 * * *'
  # EVERY merge to main, with no `paths` filter. Until 2026-11-04 this job only ran on a main
  # push that touched this file or `build.gradle`, so a normal code merge reached main verified by
  # the ~770-test subset and the emulator smoke alone, and the merge commit that people install
  # was never checked in full until the next nightly — which had already been red twice for
  # exactly that reason (runs 41433088889, 41622389696). The whole suite is 12 minutes; a merge to
  # main is the one commit where that is unconditionally worth spending.
  push:
    branches:
      - main
  # A pull request gets the full suite too, on its own branch, so a red class shows up before the
  # merge rather than the morning after it. `synchronize` covers later pushes; `concurrency`
  # cancels the superseded run, so only the newest commit of a branch actually finishes.
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group PER REF (a branch, or a pull request's merge ref). Until 2026-11-11 this was the
  # single name `full-test-suite`, so runs for unrelated commits cancelled each other: PR #26's
  # run (42938417424) was cancelled by the push that merged it, and any pull-request push would
  # equally have cancelled an in-flight run for `main` or the nightly -- leaving the one commit
  # people install unverified until the next night. The nightly and a push to `main` share
  # `refs/heads/main`, which is right: both test `main`, and the newer commit wins.
  group: full-test-suite-${{ github.ref }}
  # A stale run is worthless once a newer commit OF THE SAME REF exists, and this suite can
  # occupy a runner for tens of minutes: supersede instead of queueing behind it.
  cancel-in-progress: true

jobs:
  unit-tests:
    # Pinned like the other two workflows; see the note in `emulator-smoke.yml`.
    runs-on: ubuntu-24.04
    # Measured 2026-11-01: a normal whole-suite run takes 11-12 minutes; one run sat inside the
    # test task for 90+ minutes with no progress. The Gradle test task is now bounded at 45
    # minutes (build.gradle), so 75 leaves room for checkout, setup, the report step and the
    # upload, and none of it can be spent sitting on a wedged class.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # No `--tests` filter: this job's whole point is that nothing is skipped for being
      # unlisted. `--continue` is not needed (Gradle runs every test in the task), and the task
      # is allowed to fail so the summary below still runs and reports.
      - name: Unit tests (whole suite, minus the memory-hungry engine classes)
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          # This step must always reach the XML copy below, even when Gradle fails: the report
          # step needs the XML to say WHY. So the exit code is RECORDED rather than allowed to
          # abort the step, and the gate at the bottom of the job decides the verdict.
          #
          # A COMPILE failure and a TEST failure are not the same thing, and until 2026-11-09
          # both were erased by a trailing `|| true`. A Kotlin raw-string error in a new test
          # class made `:compileDebugUnitTestKotlin` fail, no JUnit XML was produced, and this job
          # reported SUCCESS -- broken test code could merge green. Hence the recorded exit code.
          mkdir -p build
          # If this is still running long after it should have finished, write down what it is
          # doing (scripts/ci/test-wedge-watchdog.sh). The step normally takes 5 to 9 minutes.
          rm -rf "$RUNNER_TEMP/test-wedge" "$RUNNER_TEMP"/test-gc-*.log
          bash scripts/ci/test-wedge-watchdog.sh "$RUNNER_TEMP/test-wedge" "whole suite" 15 30 \
            > /dev/null 2>&1 &
          watchdog=$!
          set +e
          # -PtestGcLog: the test JVM logs its collections (build.gradle); summarised below.
          #
          # -PtestMaxHeap=1g, since 2026-11-12. Until then this invocation ran on Gradle's default,
          # 512 MB, and the first collection log ever read (run 43259344146) said the suite had
          # grown to the edge of it: "61 full collections ... paused 27.3 s in all (8.0%) ...
          # concurrent work 94.5 s; heap left after a collection: 100M, 162M, 283M, 475M at each
          # quarter of the run, of a possible 512M". A JVM that full does not fail, it slows
          # down, and a little fuller it slows down a great deal: that is the likeliest account
          # of the run that sat here until the 45-minute bound (43242985447), though that run
          # itself left nothing to prove it. The first run at 1 GB (43266527543) read "36 full
          # collections ... paused 15.4 s in all (3.9%) ... concurrent work 50.0 s; ... 86M,
          # 156M, 295M, 554M ..., of a possible 1024M": half the collector's work, and the
          # suite a little over half way to the new limit. (36 full collections are what one
          # test asks for with System.gc(); the line counts those apart now.) The "Test JVM"
          # annotation says after every run how much of the limit was used, and turns into a
          # warning from 85%. docs/TEST-PITFALLS.md, CI traps 5 and 9.
          #
          # Not 3 GB: that was tried for everything at once on 2026-10-31, engine classes
          # included, and the run was abandoned after 70 minutes (see the next step).
          ./gradlew testDebugUnitTest -PskipHeavy=true -PtestMaxHeap=1g \
            -PtestGcLog="$RUNNER_TEMP/test-gc-whole.log" \
            --stacktrace 2>&1 | tee unit-test-output.log
          gradle_exit=$?
          set -e
          kill "$watchdog" 2>/dev/null || true
          echo "gradle_exit=$gradle_exit" > build/unit-test-gradle-exit.txt
          # Gradle deletes a re-run task's previous outputs, and the heavy invocation below is a
          # re-run of this same task: without this copy its XML vanished and the report covered
          # 7 classes instead of 423 (first attempt, run 41366549694).
          rm -rf build/full-suite-xml
          mkdir -p build/full-suite-xml
          cp -r build/test-results/testDebugUnitTest/. build/full-suite-xml/ 2>/dev/null || true

      # The engine accuracy/benchmark classes hold the whole 98k-word lexicon (some hold several)
      # and die with OutOfMemoryError on the default heap. They are not slow, they are hungry: a
      # 3 GB heap for the ENTIRE suite was measured on 2026-10-31 to turn a 12-minute run into a
      # 70-minute GC crawl, so they get their own invocation, their own heap, their own 45-minute
      # bound (build.gradle) and their own JUnit XML directory, which the report step below reads
      # alongside the main one.
      - name: Unit tests (memory-hungry engine classes, 3g heap)
        id: heavy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          # Normally under a minute.
          bash scripts/ci/test-wedge-watchdog.sh "$RUNNER_TEMP/test-wedge" "memory-hungry classes" 10 25 \
            > /dev/null 2>&1 &
          watchdog=$!
          # Recorded, like the first invocation's, for the gate at the bottom of the job. Until
          # 2026-11-12 a trailing `|| true` erased it.
          set +e
          ./gradlew testDebugUnitTest -PonlyHeavy=true -PtestMaxHeap=3g \
            -PtestGcLog="$RUNNER_TEMP/test-gc-heavy.log" \
            -PjunitXmlDir=build/test-results/heavy --stacktrace 2>&1 | tee heavy-test-output.log
          heavy_exit=$?
          set -e
          kill "$watchdog" 2>/dev/null || true
          echo "gradle_exit=$heavy_exit" > build/heavy-test-gradle-exit.txt

      # How the test JVMs spent their time, as annotations: the one thing about a run that the
      # development sandbox can read. Its own step, so that the ten-per-step cap on annotations
      # cannot drop these behind the report's.
      #
      #  * "Test JVM", on every run: one line per invocation from its collection log
      #    (scripts/ci/test-gc-summary.py says how to read it). A notice, or a warning when the
      #    JVM, at its fullest, still had 85% or more of its limit in use after a collection.
      #  * "Long test run", only when a run went on too long: what it was doing at the time. An
      #    error when the run then failed; a warning when it was merely slow and finished.
      - name: Say how the test JVMs spent their time
        if: always()
        # Diagnostics only: a mistake in here must not be able to fail the job or skip the report.
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          for which in whole heavy; do
            label="whole suite"; [ "$which" = "heavy" ] && label="memory-hungry classes"
            line=$(python3 scripts/ci/test-gc-summary.py "$label" "$RUNNER_TEMP/test-gc-$which.log" 2>/dev/null || true)
            # A warning when the line itself says the JVM is nearly out of room; a notice otherwise.
            how=notice; case "$line" in *"NEARLY OUT OF ROOM"*) how=warning ;; esac
            if [ -n "$line" ]; then echo "::$how title=Test JVM::${line//%/%25}"; fi
          done
          level=warning
          for f in build/unit-test-gradle-exit.txt build/heavy-test-gradle-exit.txt; do
            [ "$(sed -n 's/^gradle_exit=//p' "$f" 2>/dev/null | tail -1)" = "0" ] || level=error
          done
          for f in "$RUNNER_TEMP"/test-wedge/*.txt; do
            body=$(head -c 24000 "$f" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::${level} title=Long test run::${body}"
            { echo '```'; head -c 24000 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Report results as annotations and a job summary
        shell: bash
        run: |
          esc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g'; }
          if [ -f unit-test-output.log ]; then
            grep -E "^e: |: error: |^> Task .* FAILED" unit-test-output.log | head -3 | esc \
              | while IFS= read -r line; do echo "::error::${line}"; done || true
            # A task that fails before producing any XML says WHY only in this block; without it
            # the report is "no JUnit XML found", which names nothing.
            sed -n '/What went wrong/,/^\* Try/p' unit-test-output.log | head -6 | esc \
              | while IFS= read -r line; do echo "::error::GRADLE ${line}"; done || true
          fi
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET

          def esc(t):
              return t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          rows, cases, times = [], [], []
          for f in sorted(glob.glob('build/full-suite-xml/*.xml') +
                          glob.glob('build/test-results/heavy/*.xml')):
              try:
                  r = ET.parse(f).getroot()
              except Exception:
                  continue
              name = r.get('name', '?')
              tests, skipped = int(r.get('tests', 0)), int(r.get('skipped', 0))
              failed = int(r.get('failures', 0)) + int(r.get('errors', 0))
              rows.append((name, tests, failed, skipped))
              try:
                  times.append((float(r.get('time', 0) or 0), name))
              except ValueError:
                  pass
              for case in r.iter('testcase'):
                  for kind in ('failure', 'error'):
                      node = case.find(kind)
                      if node is None:
                          continue
                      msg = ' '.join((node.get('message') or node.text or '').split())
                      # Two project frames: the message alone cannot say WHICH line, and the
                      # runner log is not reachable outside the web UI.
                      frames = []
                      for line in (node.text or '').splitlines():
                          if 'tribixbite.cleverkeys' not in line or 'Test' in line:
                              continue
                          at = line.strip()
                          if at.startswith('at '):
                              at = at[3:]
                          head, _, tail = at.partition('(')
                          frames.append(head.split('.')[-1] + '(' + tail)
                          if len(frames) == 2:
                              break
                      cases.append((name, case.get('name', '?'), msg, frames))
                      break

          if not rows:
              print('::warning::no JUnit XML found - the test task did not run')
              raise SystemExit(0)

          total = sum(r[1] for r in rows)
          bad = sum(r[2] for r in rows)
          # For the gate at the bottom of the job (scripts/ci/full-suite-verdict.sh).
          with open('build/unit-test-failed.txt', 'w') as fh:
              fh.write('%d\n' % bad)
          # Where the time went, so that two runs can be compared class by class. The sum is
          # time inside test classes; the step's own duration (in the API) holds the rest.
          if times:
              times.sort(reverse=True)
              print('::notice::test time: %.0f s inside %d classes; slowest: %s'
                    % (sum(t for t, _ in times), len(times),
                       ', '.join('%s %.1fs' % (n.split('.')[-1], t) for t, n in times[:12])[:1500]))
          skipped = sum(r[3] for r in rows)
          bad_classes = sorted([r for r in rows if r[2]], key=lambda r: (-r[2], r[0]))
          print('::notice::unit tests: %d run, %d failed, %d skipped in %d classes'
                % (total, bad, skipped, len(rows)))

          skipped_classes = [r for r in rows if r[3] and not r[2]]
          if skipped_classes:
              print('::notice::%d class(es) skipped their checks (upstream artefacts absent): %s'
                    % (len(skipped_classes),
                       ', '.join(r[0].split('.')[-1] for r in skipped_classes)[:1000]))

          if bad_classes:
              # Order matters: GitHub drops annotations past its per-run cap, and the first
              # failure of each class is what makes the rest diagnosable. Emit it before the
              # class list and the per-test names.
              parts, size = [], 0
              for name, tests, failed, _ in bad_classes:
                  first = next((c for c in cases if c[0] == name), None)
                  if first is None:
                      continue
                  trace = (' <' + ' '.join(first[3]) + '>') if first[3] else ''
                  seg = '%s#%s: %s%s' % (name.split('.')[-1], first[1], first[2][:110], trace)
                  if size + len(seg) > 3000:
                      break
                  parts.append(seg)
                  size += len(seg) + 2
              print('::error::' + esc('FIRST FAILURE PER CLASS (top): ' + ' || '.join(parts))[:3000])

              short = '; '.join('%s %d/%d' % (n.split('.')[-1], f, t) for n, t, f, _ in bad_classes)
              print('::error::' + esc('FAILING CLASSES (%d): %s' % (len(bad_classes), short))[:3000])

              names = {}
              for name, case, _, _ in cases:
                  names.setdefault(name, []).append(case)
              detail = '; '.join('%s: %s' % (n.split('.')[-1], ', '.join(v[:40]))
                                 for n, v in sorted(names.items()))
              print('::error::' + esc('FAILING TESTS: ' + detail)[:60000])

              summary = ['### Unit tests', '',
                         '- %d run, **%d failed**, %d skipped, %d classes' % (total, bad, skipped, len(rows)),
                         '', '#### Failing classes', '']
              summary += ['- `%s` — %d of %d' % (n, f, t) for n, t, f, _ in bad_classes]
              summary += ['', '#### Failures (first 80)', '']
              for name, case, msg, frames in cases[:80]:
                  summary.append('- `%s#%s`: %s%s' % (name.split('.')[-1], case, msg[:300],
                                                     (' <' + ' '.join(frames) + '>') if frames else ''))
              path = os.environ.get('GITHUB_STEP_SUMMARY')
              if path:
                  with open(path, 'a') as fh:
                      fh.write('\n'.join(summary) + '\n')
          else:
              print('::notice::all %d unit tests passed' % total)
          PY

      # The annotations truncate; this keeps the full JUnit XML (every message and stack trace) for
      # a day, which is the difference between "some test failed" and a diagnosis.
      - name: Upload unit-test XML
        if: always()
        uses: actions/upload-artifact@v4
        # AGENTS.md: every upload is continue-on-error, so a full artifact quota cannot change
        # this job's verdict. The verdict is the gate step below, which needs no upload.
        continue-on-error: true
        with:
          name: full-suite-xml
          path: |
            build/full-suite-xml/*.xml
            build/test-results/heavy/*.xml
          if-no-files-found: ignore
          retention-days: 1

      # The verdict. The two test steps above cannot fail by themselves (so that the report always
      # runs and says why), which leaves this step as the only gate. It is a script so that it can
      # be run against made-up results before it is trusted: scripts/ci/full-suite-verdict.sh,
      # whose header says how the check came to be green with failing tests until 2026-11-12.
      #
      # Green needs all of: both Gradle invocations exited 0, JUnit XML exists, and the report
      # counted no failure in it. A run that hit its time bound, did not compile, or left
      # anything missing is red: "nothing was verified" must never look like "all passed".
      - name: Fail the job unless every test ran and passed
        if: always()
        shell: bash
        run: bash scripts/ci/full-suite-verdict.sh
